name: Cross-browser checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Run browser and graphics compatibility checks
        env:
          BROWSERS: ${{ matrix.browser }}
          BROWSER: ${{ matrix.browser }}
          RESPONSIVE_BASE_URL: http://127.0.0.1:4270
        run: |
          npm run dev -- --port 4270 > /tmp/vite.log 2>&1 &
          npm run preview -- --port 4271 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$RESPONSIVE_BASE_URL" >/dev/null && curl -fsS http://127.0.0.1:4271 >/dev/null && break; sleep 1; done
          set +e
          RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/puzzle-check.mjs > /tmp/browser-test.log 2>&1
          result=$?
          cat /tmp/browser-test.log
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/puzzle-input-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/puzzle-sync-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/weak-network-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/motion-performance-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4270 node scripts/review-worker-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/archive-motion-check.mjs > /tmp/browser-test.log 2>&1
            result=$?
            cat /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 npm run test:cross-browser > /tmp/cross-browser.log 2>&1
            result=$?
            cat /tmp/cross-browser.log
            cp /tmp/cross-browser.log /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            npm run test:particles-compat > /tmp/particles-test.log 2>&1
            result=$?
            cat /tmp/particles-test.log
            cp /tmp/particles-test.log /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/search-loader-check.mjs > /tmp/loader-test.log 2>&1
            result=$?
            cat /tmp/loader-test.log
            cp /tmp/loader-test.log /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/play-lobby-motion-check.mjs > /tmp/lobby-motion.log 2>&1
            result=$?
            cat /tmp/lobby-motion.log
            cp /tmp/lobby-motion.log /tmp/browser-test.log
          fi
          if [ "$result" -eq 0 ]; then
            RESPONSIVE_BASE_URL=http://127.0.0.1:4271 node scripts/match-result-check.mjs > /tmp/match-result.log 2>&1
            result=$?
            cat /tmp/match-result.log
            cp /tmp/match-result.log /tmp/browser-test.log
          fi
          if [ "$result" -ne 0 ]; then
            details=$(tail -50 /tmp/browser-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error::$details"
          fi
          exit "$result"
