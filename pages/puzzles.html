<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пазлы — shahmat.xyz</title><link rel="stylesheet" href="/pages/play.css"><link rel="stylesheet" href="/pages/game.css"><link rel="stylesheet" href="/pages/board-layout.css"><link rel="stylesheet" href="/pages/puzzles.css"><script type="module" src="/motion/frame.js"></script><script type="module" src="/pages/puzzles.js"></script></head>
<body><main id="puzzle-app" class="member-shell puzzle-shell">
 <section class="puzzle-main" id="puzzle-main" data-lenis-prevent>
  <div id="puzzle-play" class="puzzle-view">
   <div class="puzzle-board-column"><div class="board-frame"><div id="board" class="board ready" role="group" aria-label="Позиция пазла"></div></div></div>
  </div>
  <div id="puzzle-dashboard" class="puzzle-view" hidden><header class="puzzle-heading"><div><h1>Dashboard</h1></div><select id="puzzle-period" aria-label="Период"><option value="30">30 дней</option><option value="90">90 дней</option><option value="365">Год</option><option value="0">Всё время</option></select></header><div id="dashboard-content"></div></div>
  <div id="puzzle-themes" class="puzzle-view" hidden><header class="puzzle-heading"><div><h1>Themes</h1></div></header><div id="themes-content" class="puzzle-themes-grid"></div></div>
  <div id="puzzle-history" class="puzzle-view" hidden><header class="puzzle-heading"><h1>История</h1></header><div id="history-content" class="puzzle-history-grid"></div></div>
 </section>
 <aside class="game-rail puzzle-rail" data-lenis-prevent aria-label="Пазлы"><nav class="puzzle-nav" aria-label="Разделы пазлов"><button data-view="play" aria-current="page"><span aria-hidden="true">◈</span> Пазлы</button><button data-view="dashboard"><span aria-hidden="true">▤</span> Dashboard</button><button data-view="themes"><span aria-hidden="true">▦</span> Themes</button><button data-view="history" class="puzzle-history-nav"><span aria-hidden="true">◷</span> История</button></nav><div id="puzzle-rail-content"><div class="puzzle-actions"><div class="puzzle-theme-label" id="puzzle-theme-label">Микс</div><div class="puzzle-rating"><span>Рейтинг пазлов</span><strong><span id="puzzle-rating">1500</span> <small id="puzzle-unit">ЯР</small></strong></div><div class="puzzle-status-card"><div class="puzzle-side-to-move"><img id="puzzle-king" alt=""><div class="puzzle-status-copy"><strong id="puzzle-turn">Загрузка</strong><h2 id="puzzle-status" role="status" aria-live="polite">Загрузка</h2><p id="puzzle-feedback"></p><div id="rating-change" class="puzzle-rating-change" hidden></div></div></div></div><button id="puzzle-next" class="puzzle-primary" hidden>Следующий пазл <span>→</span></button><div class="puzzle-tools"><button id="puzzle-hint">Подсказка</button><button id="puzzle-solution">Показать решение</button></div><p id="puzzle-sync-status" class="puzzle-sync-status" role="status" aria-live="polite"></p><div id="rating-history" class="puzzle-rating-history" aria-label="Последние изменения рейтинга"></div></div><div class="puzzle-moves" aria-label="Ходы пазла"><h2>Ходы</h2><p id="history-source-status" class="history-source-status" aria-live="polite"></p><div id="puzzle-move-list" data-lenis-prevent></div><div class="puzzle-move-controls"><button id="puzzle-first" aria-label="В начало">|‹</button><button id="puzzle-prev" aria-label="Предыдущий ход">‹</button><button id="puzzle-forward" aria-label="Следующий ход">›</button><button id="puzzle-last" aria-label="В конец">›|</button></div></div></div></aside>
 <div id="promotion" class="puzzle-promotion" hidden role="dialog" aria-modal="true" aria-label="Превращение пешки"><div><button data-piece="q" aria-label="Ферзь">♛</button><button data-piece="r" aria-label="Ладья">♜</button><button data-piece="b" aria-label="Слон">♝</button><button data-piece="n" aria-label="Конь">♞</button><button id="promotion-cancel" aria-label="Отмена">×</button></div></div>
</main></body></html>
