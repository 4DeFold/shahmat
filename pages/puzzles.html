<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пазлы — shahmat.xyz</title><link rel="stylesheet" href="/pages/play.css"><link rel="stylesheet" href="/pages/game.css"><link rel="stylesheet" href="/pages/board-layout.css"><link rel="stylesheet" href="/pages/puzzles.css"><script type="module" src="/pages/puzzles.js"></script></head>
<body><main id="puzzle-app" class="member-shell puzzle-shell">
 <section class="puzzle-main" id="puzzle-main">
  <div id="puzzle-play" class="puzzle-view">
   <header class="puzzle-heading"><div><span class="puzzle-kicker">ТРЕНИРОВКА</span><h1>Пазлы</h1></div><div class="puzzle-rating"><span>Рейтинг</span><strong id="puzzle-rating">1500</strong></div></header>
   <div class="puzzle-layout"><div class="puzzle-board-column"><div class="puzzle-turn"><span id="turn-dot"></span><strong id="puzzle-turn">Загрузка</strong><span id="puzzle-id"></span></div><div class="board-frame"><div id="board" class="board ready" role="group" aria-label="Позиция пазла"></div></div><div class="puzzle-board-footer"><span id="puzzle-theme-label">Все темы</span><span id="puzzle-difficulty"></span></div></div>
   <div class="puzzle-actions"><div class="puzzle-status-card"><span class="puzzle-kicker">ЗАДАЧА</span><h2 id="puzzle-status" role="status" aria-live="polite">Загрузка</h2><p id="puzzle-feedback"></p><div id="rating-change" class="puzzle-rating-change" hidden></div></div><button id="puzzle-next" class="puzzle-primary" hidden>Следующий пазл <span>→</span></button><div class="puzzle-tools"><button id="puzzle-hint">Подсказка</button><button id="puzzle-solution">Показать решение</button></div></div></div>
  </div>
  <div id="puzzle-dashboard" class="puzzle-view" hidden><header class="puzzle-heading"><div><span class="puzzle-kicker">СТАТИСТИКА</span><h1>Dashboard</h1></div><select id="puzzle-period" aria-label="Период"><option value="30">30 дней</option><option value="90">90 дней</option><option value="365">Год</option><option value="0">Всё время</option></select></header><div id="dashboard-content"></div></div>
  <div id="puzzle-themes" class="puzzle-view" hidden><header class="puzzle-heading"><div><span class="puzzle-kicker">ТРЕНИРОВКА</span><h1>Themes</h1></div></header><div id="themes-content" class="puzzle-themes-grid"></div></div>
 </section>
 <aside class="game-rail puzzle-rail" aria-label="Пазлы"><div class="puzzle-rail-top"><span class="puzzle-kicker">ШАХМАТНАЯ ПРАКТИКА</span><strong>Пазлы</strong></div><nav class="puzzle-nav" aria-label="Разделы пазлов"><button data-view="play" aria-current="page"><span>◈</span> Пазлы</button><button data-view="dashboard"><span>▤</span> Dashboard</button><button data-view="themes"><span>▦</span> Themes</button></nav><div class="puzzle-rail-info"><span>РЕЙТИНГ</span><strong id="rail-rating">1500</strong><small>Локально</small></div><a class="puzzle-source" href="https://database.lichess.org/#puzzles" target="_blank" rel="noopener">Lichess · CC0 ↗</a></aside>
 <div id="promotion" class="puzzle-promotion" hidden role="dialog" aria-modal="true" aria-label="Превращение пешки"><div><button data-piece="q" aria-label="Ферзь">♛</button><button data-piece="r" aria-label="Ладья">♜</button><button data-piece="b" aria-label="Слон">♝</button><button data-piece="n" aria-label="Конь">♞</button><button id="promotion-cancel" aria-label="Отмена">×</button></div></div>
</main></body></html>
