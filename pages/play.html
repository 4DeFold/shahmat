<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Игра с ботом — shahmat.xyz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pages/play.css">
  <script type="module" src="/pages/play.js"></script>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <a class="brand" href="/" aria-label="shahmat.xyz — на главную"><span>shah</span>mat.xyz</a>
      <a class="back" href="/">← На главную</a>
    </header>
    <main class="game-layout">
      <section class="board-section" aria-labelledby="game-title">
        <div class="game-heading"><h1 id="game-title">Игра с ботом<span>.</span></h1></div>
        <div class="player-row"><span class="avatar bot-avatar"><img src="/pieces/neo/bN.png" alt=""></span><span><strong>Бот</strong><small>Чёрные</small></span></div>
        <div class="board-frame"><div class="board" id="board" role="group" aria-label="Шахматная доска"></div></div>
        <div class="player-row"><span class="avatar"><img src="/pieces/neo/wP.png" alt=""></span><span><strong>Вы</strong><small>Белые</small></span></div>
      </section>
      <aside class="game-panel" aria-label="Информация о партии">
        <p class="description">Выберите фигуру и клетку для хода.</p>
        <div class="status-card"><span class="status-dot"></span><div><p id="status" role="status" aria-live="polite">Ваш ход</p></div></div>
        <div class="promotion" id="promotion" hidden><p>Выберите фигуру для превращения пешки:</p><div id="promotion-options"></div></div>
        <div class="moves"><div class="moves-header"><span>ХОДЫ</span><span id="move-count">00</span></div><ol id="move-list" aria-label="История ходов"></ol><p id="empty-moves">Пока нет ходов</p></div>
        <a class="new-game" id="new-game" href="/login?mode=signup" aria-label="Новая партия — регистрация">Новая партия <span>↗</span></a>
        <p class="footnote" id="storage-message" role="status">Партия сохраняется на этом устройстве.</p>
      </aside>
    </main>
  </div>
</body>
</html>
