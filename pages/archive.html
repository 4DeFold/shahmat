<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Архив — shahmat.xyz</title><link rel="stylesheet" href="/pages/play.css"><link rel="stylesheet" href="/pages/game.css"><link rel="stylesheet" href="/pages/archive.css"><link rel="stylesheet" href="/pages/board-layout.css"><script type="module" src="/pages/archive.js"></script></head>
<body><main class="member-shell archive-shell" id="archive-app">
<section id="archive-main" class="archive-main" aria-label="Архив партий"><div id="archive-content"><div id="archive-grid" class="archive-grid"></div><button type="button" id="archive-more" class="archive-more" hidden>Показать ещё</button><div id="archive-detail" class="board-wrap archive-detail" hidden><div class="player-row opponent-row"><span class="avatar"><img id="archive-top-avatar" src="/pieces/cburnett/bN.svg" alt=""></span><span class="player-info"><strong id="black-name"></strong><span id="archive-opponent-captured" class="captured-pieces" aria-label="Взятые фигуры"></span></span></div><div class="board-frame"><div id="board" class="board ready" role="group" aria-label="Позиция партии"></div></div><div class="player-row"><span class="avatar"><img id="archive-bottom-avatar" src="/pieces/cburnett/wN.svg" alt=""></span><span class="player-info"><strong id="white-name"></strong><span id="archive-player-captured" class="captured-pieces" aria-label="Взятые фигуры"></span></span></div></div></div></section>
<aside class="game-rail" aria-label="Архив"><div class="rail-content"><div id="archive-modes" class="archive-modes" aria-label="Режимы"><button type="button" data-mode="all" aria-pressed="true">Общее</button><button type="button" data-mode="blitz" aria-pressed="false">Блиц</button><button type="button" data-mode="rapid" aria-pressed="false">Рапид</button><button type="button" data-mode="classical" aria-pressed="false">Классика</button><button type="button" data-mode="bot" aria-pressed="false">Бот</button></div><div class="loading-status-row"><span class="particle-loading" data-loading="status" hidden role="status" aria-label="Загрузка"><canvas aria-hidden="true"></canvas></span><p id="archive-status" role="status" aria-label="Загрузка"></p></div><div id="archive-history" hidden><button id="archive-back" class="archive-back" type="button">← Назад</button><div class="moves"><div class="moves-header">ХОДЫ <span id="move-count">00</span></div><div class="history-controls"><button id="history-first" aria-label="В начало">«</button><button id="history-prev" aria-label="Предыдущий ход">‹</button><button id="history-next" aria-label="Следующий ход">›</button><button id="history-last" aria-label="В конец">»</button></div><ol id="move-list" aria-label="История ходов"></ol></div></div></div></aside>
</main></body></html>
