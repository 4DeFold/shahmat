<section class="rating-page" id="page-rating" data-view="rating" hidden aria-labelledby="page-rating-title">
  <header class="rating-heading"><h2 id="page-rating-title" tabindex="-1">Рейтинг<span>.</span></h2></header>
  <div class="rating-filters" role="group" aria-label="Режим рейтинга">
    <span class="rating-indicator" aria-hidden="true"></span>
    <button type="button" class="rating-filter" data-rating-mode="overall" aria-pressed="true">Общий</button>
    <button type="button" class="rating-filter" data-rating-mode="blitz" aria-pressed="false">Блиц</button>
    <button type="button" class="rating-filter" data-rating-mode="rapid" aria-pressed="false">Рапид</button>
    <button type="button" class="rating-filter" data-rating-mode="classical" aria-pressed="false">Классика</button>
  </div>
  <div class="rating-board" aria-busy="false">
    <div class="rating-columns" aria-hidden="true"><span>№</span><span>Игрок</span><span class="rating-unit">ЯР</span></div>
    <ol class="rating-list" aria-label="Рейтинг игроков"></ol>
    <div class="rating-self" data-profile-no-hover hidden role="button" tabindex="0" aria-label="Открыть свой профиль"><span class="rating-self-place"></span><span class="rating-person"><img class="rating-avatar" src="/pieces/cburnett/wN.svg" alt=""><span class="rating-self-name"></span></span><span class="rating-self-score"></span></div>
    <div class="loading-status-row"><span class="particle-loading" data-loading="rating" hidden aria-hidden="true"><canvas></canvas></span><p class="rating-status" role="status" aria-live="polite" hidden></p></div>
    <button class="rating-retry" type="button" hidden>Повторить</button>
  </div>
</section>
