<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Играть — shahmat.xyz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pages/play.css">
  <link rel="stylesheet" href="/pages/game.css">
  <script type="module" src="/pages/game.js"></script>
</head>
<body>
  <main class="member-shell" id="member-game">
    <section class="board-area" aria-label="Шахматная доска">
      <div class="board-wrap">
        <div class="player-row opponent-row"><button type="button" class="opponent-trigger" id="opponent-profile-trigger" aria-expanded="false" aria-controls="opponent-profile-card" disabled><span class="avatar bot-avatar"><img id="opponent-avatar-image" src="/pieces/cburnett/bN.svg" alt=""></span><span><strong id="opponent-name">Соперник</strong> <span class="player-rating" id="opponent-rating"></span><small id="opponent-color">Чёрные</small></span></button><div class="opponent-profile-card" id="opponent-profile-card" hidden><div class="opponent-card-banner"><img id="opponent-profile-banner" alt="" hidden></div><img id="opponent-profile-avatar" class="opponent-card-avatar" src="/pieces/cburnett/bN.svg" alt=""><strong id="opponent-profile-name">Соперник</strong><span class="bio-label" id="opponent-profile-bio-label" hidden>Био</span><p id="opponent-profile-bio" hidden></p><button type="button" id="opponent-profile-open">Открыть профиль ↗</button></div></div>
        <div class="board-with-clocks"><div class="board-frame"><div class="board waiting" id="board" role="group" aria-label="Шахматная доска"></div></div>
          <div class="clock-pair" aria-label="Шахматные часы">
            <div class="clock" id="opponent-clock-card" data-color="neutral"><span id="opponent-clock-label" hidden></span><strong id="opponent-clock">00:00</strong></div>
            <div class="clock" id="player-clock-card" data-color="neutral"><span id="player-clock-label" hidden></span><strong id="player-clock">00:00</strong></div>
          </div></div>
        <div class="player-row"><button type="button" id="player-profile-trigger" class="opponent-trigger"><span class="avatar"><img id="player-avatar-image" src="/pieces/cburnett/wP.svg" alt=""></span><span><strong id="player-name">Вы</strong> <span class="player-rating" id="player-rating"></span><small id="player-color"></small></span></button></div>
        <div class="promotion" id="promotion" hidden><p>Выберите фигуру для превращения пешки:</p><div id="promotion-options"></div></div>
      </div>
    </section>
    <aside class="game-rail" aria-label="Настройки партии">
      <div class="rail-content">
        <div class="mode-picker" id="mode-picker"><div class="mode-picker-inner"><p class="rail-label" id="mode-label">ВЫБЕРИ РЕЖИМ</p>
        <fieldset class="mode-list" id="mode-list"><legend class="visually-hidden">Режим партии</legend>
          <label class="mode-option"><input type="radio" name="mode" value="blitz"><span><strong>Блиц</strong><small>3 минуты</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="rapid"><span><strong>Рапид</strong><small>10 минут</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="classical"><span><strong>Классика</strong><small>1 час</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="daily"><span><strong>Дневная</strong><small>24 часа</small></span></label>
        </fieldset></div></div>
        <div class="mode-summary" id="mode-summary" hidden></div>
        <button class="new-game" id="start-search" type="button" hidden disabled>Начать <span>↗</span></button>
        <button class="cancel-search" id="cancel-search" type="button" hidden>Отменить поиск</button>
        <button class="cancel-search" id="new-game" type="button" hidden>Новая партия</button>
        <div id="resign-control" hidden><button class="leave-game" id="resign-button" type="button">Сдаться</button></div>
        <section class="offline-choice" id="offline-choice" hidden aria-label="Соперник не в сети">
          <p>Соперник не в сети больше минуты. Как завершить партию?</p>
          <button type="button" id="offline-win">Засчитать победу</button><button type="button" id="offline-draw">Засчитать ничью</button>
        </section>
        <div class="status-card game-notice"><span class="shine-border" aria-hidden="true"></span><span class="status-dot"></span><p class="game-status" id="status" role="status" aria-live="polite">Выбери режим.</p></div>
        <div class="moves" id="moves" hidden><div class="moves-header"><button id="toggle-moves" type="button" aria-expanded="true" aria-controls="history-content">ХОДЫ <span id="move-count">00</span> <span class="history-chevron" aria-hidden="true">▾</span></button></div><div id="history-content" class="history-content"><div class="history-inner"><div class="history-controls"><button id="history-first" type="button" aria-label="В начало">⏮</button><button id="history-prev" type="button" aria-label="Предыдущий ход">‹</button><button id="history-next" type="button" aria-label="Следующий ход">›</button><button id="history-last" type="button" aria-label="К текущей позиции">⏭</button></div><ol id="move-list" aria-label="История ходов"></ol></div></div></div>
        <div class="online-counter" id="online-counter" aria-label="Онлайн: нет соединения"><strong id="online-value">—</strong><span class="online-label">ОНЛАЙН</span></div>
      </div>
    </aside>
  </main>
  <dialog class="resign-dialog" id="resign-dialog" aria-labelledby="resign-title" aria-describedby="resign-description">
    <h2 id="resign-title">Вы уверены?</h2><p id="resign-description">После сдачи вам будет засчитано поражение.</p>
    <div class="dialog-actions"><button type="button" id="resign-cancel">Продолжить игру</button><button type="button" id="resign-confirm">Да, сдаться</button></div>
  </dialog>
</body>
</html>
