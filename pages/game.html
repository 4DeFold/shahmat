<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Играть — shahmat.xyz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pages/play.css">
  <link rel="stylesheet" href="/pages/game.css">
  <script type="module" src="/pages/game.js"></script>
</head>
<body>
  <div class="game-shell member-shell">
    <main>
      <div id="member-game">
        <div class="game-layout">
          <section class="board-section" aria-label="Шахматная доска">
            <div class="player-row"><span class="avatar bot-avatar"><img src="/pieces/cburnett/bN.svg" alt=""></span><span><strong>Бот</strong><small>Без рейтинга</small></span></div>
            <div class="board-frame"><div class="board" id="board" role="group" aria-label="Шахматная доска"></div></div>
            <div class="player-row"><span class="avatar"><img src="/pieces/cburnett/wP.svg" alt=""></span><span><strong>Вы</strong></span></div>
          </section>
          <aside class="game-panel" aria-label="Информация о партии">
            <div class="member-card">
              <div class="status-card"><span class="status-dot"></span><div><p id="status" role="status" aria-live="polite">Ваш ход</p></div></div>
              <div class="promotion" id="promotion" hidden><p>Выберите фигуру для превращения пешки:</p><div id="promotion-options"></div></div>
              <div class="moves"><div class="moves-header"><span>ХОДЫ</span><span id="move-count">00</span></div><ol id="move-list" aria-label="История ходов"></ol><p id="empty-moves">Пока нет ходов</p></div>
              <button class="new-game" id="new-game" type="button">Новая партия <span>↗</span></button>
              <p class="footnote" id="storage-message" role="status"></p>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
