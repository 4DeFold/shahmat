<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Играть — shahmat.xyz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pages/play.css">
  <link rel="stylesheet" href="/pages/game.css">
  <script type="module" src="/pages/game.js"></script>
</head>
<body>
  <main class="member-shell" id="member-game">
    <section class="board-area" aria-label="Шахматная доска">
      <div class="board-wrap">
        <div class="player-row"><span class="avatar bot-avatar"><img src="/pieces/cburnett/bN.svg" alt=""></span><span><strong id="opponent-name">Соперник</strong><small id="opponent-color">Чёрные</small></span></div>
        <div class="board-with-clocks"><div class="board-frame"><div class="board waiting" id="board" role="group" aria-label="Шахматная доска"></div></div>
          <div class="clock-pair" aria-label="Шахматные часы">
            <div class="clock" id="opponent-clock-card" data-color="neutral"><span id="opponent-clock-label" hidden></span><strong id="opponent-clock">—:—</strong></div>
            <div class="clock" id="player-clock-card" data-color="neutral"><span id="player-clock-label" hidden></span><strong id="player-clock">—:—</strong></div>
          </div></div>
        <div class="player-row"><span class="avatar"><img src="/pieces/cburnett/wP.svg" alt=""></span><span><strong>Вы</strong><small id="player-color">Белые</small></span></div>
        <div class="promotion" id="promotion" hidden><p>Выберите фигуру для превращения пешки:</p><div id="promotion-options"></div></div>
      </div>
    </section>
    <aside class="game-rail" aria-label="Настройки партии">
      <h1>Играть<span>.</span></h1>
      <div class="rail-content">
        <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="true">Звук включён</button>
        <p class="rail-label" id="mode-label">ВЫБЕРИ РЕЖИМ</p>
        <fieldset class="mode-list" id="mode-list"><legend class="visually-hidden">Режим партии</legend>
          <label class="mode-option"><input type="radio" name="mode" value="blitz"><span><strong>Блиц</strong><small>3 минуты</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="rapid"><span><strong>Рапид</strong><small>10 минут</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="classical"><span><strong>Классика</strong><small>1 час</small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="daily"><span><strong>Дневная</strong><small>24 часа</small></span></label>
        </fieldset>
        <div class="mode-summary" id="mode-summary" hidden></div>
        <button class="new-game" id="start-search" type="button" disabled>Начать <span>↗</span></button>
        <button class="cancel-search" id="cancel-search" type="button" hidden>Отменить поиск</button>
        <button class="cancel-search" id="new-game" type="button" hidden>Новая партия</button>
        <div id="leave-game-control" hidden><a class="leave-game" href="/home" target="_top">Выйти из игры</a><p class="leave-note">Партия и часы продолжат идти. Вы сможете вернуться.</p></div>
        <div class="status-card game-notice"><span class="status-dot"></span><p class="game-status" id="status" role="status" aria-live="polite">Выбери режим.</p></div>
        <div class="moves" id="moves" hidden><div class="moves-header"><button id="toggle-moves" type="button" aria-expanded="true">ХОДЫ <span id="move-count">00</span> ▾</button></div><div id="history-content"><div class="history-controls"><button id="history-first" type="button" aria-label="В начало">⏮</button><button id="history-prev" type="button" aria-label="Предыдущий ход">‹</button><button id="history-next" type="button" aria-label="Следующий ход">›</button><button id="history-last" type="button" aria-label="К текущей позиции">⏭</button></div><ol id="move-list" aria-label="История ходов"></ol></div></div>
      </div>
    </aside>
  </main>
</body>
</html>
