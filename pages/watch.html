<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Наблюдать — shahmat.xyz</title><link rel="stylesheet" href="/pages/play.css"><link rel="stylesheet" href="/pages/game.css"><link rel="stylesheet" href="/pages/watch.css"><script type="module" src="/pages/watch.js"></script></head>
<body><main class="member-shell" id="watch-app">
<section id="watch-empty" class="watch-empty" hidden><canvas id="watch-fibers" aria-hidden="true"></canvas><p>Никто не играет</p></section>
<section class="board-area" id="watch-board-area" aria-label="Доска наблюдения" hidden><div class="board-wrap">
<div class="player-row opponent-row"><button class="opponent-trigger" id="black-profile" type="button" disabled><span class="avatar bot-avatar"><img src="/pieces/cburnett/bN.svg" alt=""></span><span class="player-name-line"><strong id="black-name">Чёрные</strong><span class="player-rating" id="black-rating"></span></span></button></div>
<div class="board-with-clocks"><div class="board-frame"><div id="board" class="board ready" role="group" aria-label="Позиция наблюдаемой партии"></div></div><div class="clock-pair"><div class="clock" id="black-clock-card" data-color="b"><span>Чёрные</span><strong id="black-clock">00:00</strong></div><div class="clock" id="white-clock-card" data-color="w"><span>Белые</span><strong id="white-clock">00:00</strong></div></div></div>
<div class="player-row"><button class="opponent-trigger" id="white-profile" type="button" disabled><span class="avatar"><img src="/pieces/cburnett/wN.svg" alt=""></span><span class="player-name-line"><strong id="white-name">Белые</strong><span class="player-rating" id="white-rating"></span></span></button></div>
</div></section>
<aside class="game-rail" aria-label="Активные партии"><div class="rail-content"><div id="watch-tabs" class="watch-tabs" role="tablist" aria-label="Режимы партий" hidden></div><button type="button" id="watch-all" class="watch-all" hidden>Общее</button><p id="watch-status" role="status">Загружаем партии…</p><div id="game-list" class="watch-list" aria-label="Активные партии"></div><button type="button" class="watch-more" id="watch-more" hidden>Показать ещё</button>
<button class="watch-back" id="watch-back" type="button" hidden>← Назад</button><div class="moves" id="moves" hidden><div class="moves-header">ХОДЫ <span id="move-count">00</span></div><div class="history-controls"><button id="history-first" aria-label="В начало">⏮</button><button id="history-prev" aria-label="Предыдущий ход">‹</button><button id="history-next" aria-label="Следующий ход">›</button><button id="history-last" aria-label="К текущей позиции">⏭</button></div><ol id="move-list" aria-label="История ходов"></ol></div></div></aside>
</main></body></html>
